version: 2

models:
  - name: dim_products
    description: "Dimensao unificada de produtos de todas as fontes (Americanas, KaBuM, Amazon)"
    columns:
      - name: id
        description: "Identificador surrogate key (product_id + source)"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "ID do produto na fonte original"
        tests:
          - not_null
      - name: product_name
        description: "Nome do produto"
        tests:
          - not_null
      - name: brand
        description: "Marca do produto"
      - name: price
        description: "Preco atual do produto"
        tests:
          - not_null
      - name: original_price
        description: "Preco original (antes de desconto)"
      - name: discount_percentage
        description: "Percentual de desconto"
      - name: category
        description: "Categoria do produto"
      - name: seller
        description: "Vendedor do produto"
      - name: image_url
        description: "URL da imagem do produto"
      - name: url
        description: "URL da pagina do produto"
      - name: source
        description: "Fonte do produto (americanas, kabum, amazon)"
        tests:
          - not_null
      - name: price_tier
        description: "Faixa de preco (Economico, Medio, Premium, Luxo)"
      - name: in_stock
        description: "Produto disponivel em estoque"
      - name: scraped_at
        description: "Data/hora da raspagem"

  - name: dim_books
    description: "Dimensao de livros raspados via Scrapy com metricas e classificacoes"
    columns:
      - name: book_id
        description: "Identificador unico do livro"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "ID do livro no site original"
        tests:
          - not_null
      - name: book_name
        description: "Nome do livro"
        tests:
          - not_null
      - name: price
        description: "Preco do livro"
        tests:
          - not_null
      - name: rating
        description: "Avaliacao (1-5)"
        tests:
          - not_null
      - name: rating_label
        description: "Label da avaliacao (Excelente, Bom, Regular, Ruim)"
      - name: category
        description: "Categoria do livro"
      - name: price_vs_category
        description: "Comparacao do preco com a media da categoria"
