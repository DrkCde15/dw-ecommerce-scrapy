version: 2

models:
  - name: stg_orders
    description: "Modelo de estagiação de pedidos"
    columns:
      - name: order_id
        description: "Identificador único do pedido"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identificador do cliente"
        tests:
          - not_null
      - name: order_date
        description: "Data do pedido"
        tests:
          - not_null
      - name: status
        description: "Status do pedido"

  - name: stg_customers
    description: "Modelo de estagiação de clientes"
    columns:
      - name: customer_id
        description: "Identificador único do cliente"
        tests:
          - unique
          - not_null
      - name: email
        description: "E-mail do cliente"
        tests:
          - unique
          - not_null

  - name: stg_products
    description: "Modelo de estagiação de produtos"
    columns:
      - name: product_id
        description: "Identificador único do produto"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Nome do produto"
        tests:
          - not_null
      - name: category
        description: "Categoria do produto"
      - name: price
        description: "Preço do produto"
        tests:
          - not_null

  - name: stg_books
    description: "Modelo de estagiação de livros raspados via Scrapy"
    columns:
      - name: book_id
        description: "Identificador único do livro"
        tests:
          - unique
          - not_null
      - name: book_name
        description: "Nome do livro"
        tests:
          - not_null
      - name: price
        description: "Preço do livro"
        tests:
          - not_null
      - name: rating
        description: "Avaliação (1-5)"
        tests:
          - not_null
      - name: category
        description: "Categoria do livro"

  - name: stg_americanas
    description: "Modelo de estagiação de produtos Americanas (VTEX API)"
    columns:
      - name: id
        description: "Identificador único do registro"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "ID do produto na Americanas"
        tests:
          - not_null
      - name: product_name
        description: "Nome do produto"
        tests:
          - not_null
      - name: price
        description: "Preço atual do produto"
        tests:
          - not_null
      - name: list_price
        description: "Preço de lista (original)"
      - name: brand
        description: "Marca do produto"
      - name: category
        description: "Categoria do produto"
      - name: seller
        description: "Vendedor do produto"

  - name: stg_kabum
    description: "Modelo de estagiação de produtos KaBuM (API interna)"
    columns:
      - name: id
        description: "Identificador único do registro"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "ID do produto no KaBuM"
        tests:
          - not_null
      - name: product_name
        description: "Nome do produto"
        tests:
          - not_null
      - name: price
        description: "Preço com desconto"
        tests:
          - not_null
      - name: old_price
        description: "Preço original"
      - name: discount_percentage
        description: "Percentual de desconto"
      - name: brand
        description: "Marca do produto"
      - name: category
        description: "Categoria do produto"
      - name: stock
        description: "Quantidade em estoque"
      - name: rating
        description: "Avaliação media"
      - name: reviews_count
        description: "Quantidade de avaliacoes"

  - name: stg_amazon
    description: "Modelo de estagiação de produtos Amazon (HTML scraping)"
    columns:
      - name: id
        description: "Identificador único do registro"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "ID do produto na Amazon"
        tests:
          - not_null
      - name: product_name
        description: "Nome do produto"
        tests:
          - not_null
      - name: price
        description: "Preço atual do produto"
        tests:
          - not_null
      - name: original_price
        description: "Preço original (riscado)"
      - name: rating
        description: "Avaliação (1-5)"
      - name: reviews_count
        description: "Quantidade de avaliacoes"
      - name: image_url
        description: "URL da imagem do produto"
      - name: url
        description: "URL da pagina do produto"

sources:
  - name: raw
    description: "Dados brutos do e-commerce"
    schema: raw
    tables:
      - name: orders
        description: "Tabela de pedidos"
      - name: customers
        description: "Tabela de clientes"
      - name: products
        description: "Tabela de produtos"
      - name: order_items
        description: "Tabela de itens de pedido"
      - name: books
        description: "Livros raspados via Scrapy de books.toscrape.com"
        loaded_at_field: scraped_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
      - name: americanas
        description: "Produtos Americanas raspados via VTEX API"
        loaded_at_field: scraped_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
      - name: kabum
        description: "Produtos KaBuM raspados via API interna"
        loaded_at_field: scraped_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
      - name: amazon
        description: "Produtos Amazon raspados via HTML"
        loaded_at_field: scraped_at
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
